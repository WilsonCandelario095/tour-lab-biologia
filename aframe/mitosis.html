  <script>


    // =====================================================
    // CONFIGURACIÓN DE LAS FASES
    // =====================================================

    const phaseConfig = {

      1: {

        name: "Interfase",

        duration: 5,

        description:
          "La célula crece y realiza sus funciones normales. También duplica su ADN para prepararse para la división celular."

      },


      2: {

        name: "Profase",

        duration: 11.65,

        description:
          "El ADN se condensa y forma cromosomas visibles. La envoltura nuclear comienza a desaparecer y se forma el huso mitótico."

      },


      3: {

        name: "Metafase",

        duration: 8.33,

        description:
          "Los cromosomas se alinean en el centro de la célula. Las fibras del huso se unen a los cromosomas y los preparan para su separación."

      },


      4: {

        name: "Anafase / Telofase",

        duration: 9.10,

        description:
          "Las cromátidas hermanas se separan y se desplazan hacia polos opuestos. Después se forman dos nuevos núcleos y la célula se divide."

      }

    };


    // =====================================================
    // ESTADO
    // =====================================================

    let currentPhase = 1;

    let paused = false;

    let progress = 0;


    // =====================================================
    // DATOS DE ANIMACIÓN
    // =====================================================

    const animations = {};


    // =====================================================
    // ELEMENTOS HTML
    // =====================================================

    const phaseTitle =
      document.querySelector(
        "#phaseTitle"
      );


    const phaseCounter =
      document.querySelector(
        "#phaseCounter"
      );


    const progressBar =
      document.querySelector(
        "#progressBar"
      );


    const timeInfo =
      document.querySelector(
        "#timeInfo"
      );


    const pauseBtn =
      document.querySelector(
        "#pauseBtn"
      );


    // =====================================================
    // ELEMENTOS DEL PANEL DE DESCRIPCIÓN
    // =====================================================

    const descriptionTitle =
      document.querySelector(
        "#descriptionTitle"
      );


    const descriptionText =
      document.querySelector(
        "#descriptionText"
      );


    // =====================================================
    // REGISTRAR ANIMACIÓN DE UN MODELO
    // =====================================================

    function registerAnimation(
      elementId
    ) {

      const entity =
        document.querySelector(
          "#" + elementId
        );


      if (!entity) {

        console.warn(
          "No se encontró:",
          elementId
        );

        return;

      }


      entity.addEventListener(

        "model-loaded",

        function(event) {

          const model =
            event.detail.model;


          if (
            !model ||
            !model.animations ||
            model.animations.length === 0
          ) {

            console.warn(
              "El modelo " +
              elementId +
              " no contiene animaciones."
            );

            return;

          }


          // Usaremos la primera animación

          const clip =
            model.animations[0];


          // Crear mixer independiente

          const mixer =
            new THREE.AnimationMixer(
              model
            );


          // Crear acción

          const action =
            mixer.clipAction(
              clip
            );


          action.setLoop(
            THREE.LoopOnce,
            1
          );


          action.clampWhenFinished =
            true;


          action.play();


          // Comenzar pausado

          action.paused =
            true;


          // Guardar información

          animations[elementId] = {

            entity: entity,

            model: model,

            mixer: mixer,

            action: action,

            clip: clip,

            clipDuration: clip.duration

          };


          console.log(

            "Animación cargada:",

            elementId,

            "| Animación:",

            clip.name,

            "| Duración real:",

            clip.duration.toFixed(3),

            "segundos"

          );


          // Sincronizar si corresponde

          if (

            currentPhase ===

            getPhaseFromElement(
              elementId
            )

          ) {

            syncCurrentAnimation();

          }

        }

      );

    }


    // =====================================================
    // OBTENER FASE DE UN ELEMENTO
    // =====================================================

    function getPhaseFromElement(
      elementId
    ) {

      if (
        elementId === "phase1"
      ) {

        return 1;

      }


      if (
        elementId === "phase2"
      ) {

        return 2;

      }


      if (
        elementId === "phase3"
      ) {

        return 3;

      }


      if (
        elementId === "phase4Left" ||
        elementId === "phase4Right"
      ) {

        return 4;

      }


      return 0;

    }


    // =====================================================
    // OBTENER ANIMACIONES DE LA FASE ACTUAL
    // =====================================================

    function getCurrentAnimations() {

      const result = [];


      if (
        currentPhase === 1 &&
        animations.phase1
      ) {

        result.push(
          animations.phase1
        );

      }


      if (
        currentPhase === 2 &&
        animations.phase2
      ) {

        result.push(
          animations.phase2
        );

      }


      if (
        currentPhase === 3 &&
        animations.phase3
      ) {

        result.push(
          animations.phase3
        );

      }


      if (currentPhase === 4) {

        if (
          animations.phase4Left
        ) {

          result.push(
            animations.phase4Left
          );

        }


        if (
          animations.phase4Right
        ) {

          result.push(
            animations.phase4Right
          );

        }

      }


      return result;

    }


    // =====================================================
    // SINCRONIZAR ANIMACIÓN CON PROGRESS
    // =====================================================

    function syncCurrentAnimation() {

      const duration =
        phaseConfig[
          currentPhase
        ].duration;


      const phaseProgress =
        Math.min(

          Math.max(

            progress /
            duration,

            0

          ),

          1

        );


      const currentAnimations =
        getCurrentAnimations();


      currentAnimations.forEach(

        data => {

          // Convertir el tiempo de experiencia
          // al tiempo real del AnimationClip

          const animationTime =
            phaseProgress *
            data.clipDuration;


          data.action.paused =
            true;


          data.action.time =
            animationTime;


          data.mixer.update(0);

        }

      );


      // Actualizar separación de fase 4

      updatePhase4Separation();

    }


    // =====================================================
    // SEPARACIÓN DE ANAFASE
    // =====================================================

    function updatePhase4Separation() {

      if (
        currentPhase !== 4
      ) {

        return;

      }


      const left =
        document.querySelector(
          "#phase4Left"
        );


      const right =
        document.querySelector(
          "#phase4Right"
        );


      if (
        !left ||
        !right
      ) {

        return;

      }


      const duration =
        phaseConfig[4].duration;


      const t =
        Math.min(

          Math.max(

            progress /
            duration,

            0

          ),

          1

        );


      // Suavizado

      const smoothT =
        t * t * (3 - 2 * t);


      // Posición inicial

      const startX = 0;


      // Posición final

      const endLeftX = -1;

      const endRightX = 1;


      // Interpolación

      const leftX =
        startX +
        (endLeftX - startX) *
        smoothT;


      const rightX =
        startX +
        (endRightX - startX) *
        smoothT;


      // Aplicar posiciones

      left.object3D.position.set(

        leftX,

        3,

        -2

      );


      right.object3D.position.set(

        rightX,

        3,

        -2

      );

    }


    // =====================================================
    // MOSTRAR MODELO
    // =====================================================

    function showModel(
      phase
    ) {

      for (

        let i = 1;

        i <= 4;

        i++

      ) {

        const model =
          document.querySelector(
            "#phase" + i
          );


        if (!model) {

          continue;

        }


        model.setAttribute(

          "visible",

          i === phase

        );

      }


      // ==========================================
      // INFORMACIÓN SUPERIOR
      // ==========================================

      phaseTitle.textContent =
        phaseConfig[
          phase
        ].name;


      phaseCounter.textContent =
        "FASE " +
        phase +
        " DE 4";


      // ==========================================
      // PANEL DE DESCRIPCIÓN VR
      // ==========================================

      descriptionTitle.setAttribute(

        "value",

        phaseConfig[
          phase
        ].name

      );


      descriptionText.setAttribute(

        "value",

        phaseConfig[
          phase
        ].description

      );


      // ==========================================
      // REINICIAR TIEMPO
      // ==========================================

      progress = 0;


      progressBar.style.width =
        "0%";


      updateTimeDisplay();


      // ==========================================
      // SINCRONIZAR ANIMACIÓN
      // ==========================================

      syncCurrentAnimation();

    }


    // =====================================================
    // SIGUIENTE FASE
    // =====================================================

    function nextPhase() {

      currentPhase++;


      if (
        currentPhase > 4
      ) {

        currentPhase = 1;

      }


      showModel(
        currentPhase
      );

    }


    // =====================================================
    // FASE ANTERIOR
    // =====================================================

    function previousPhase() {

      currentPhase--;


      if (
        currentPhase < 1
      ) {

        currentPhase = 4;

      }


      showModel(
        currentPhase
      );

    }


    // =====================================================
    // PAUSA / REPRODUCCIÓN
    // =====================================================

    function togglePause() {

      paused = !paused;


      const currentAnimations =
        getCurrentAnimations();


      currentAnimations.forEach(

        data => {

          data.action.paused =
            paused;

        }

      );


      if (paused) {

        pauseBtn.setAttribute(

          "troika-text",

          "value: ▶  REPRODUCIR; " +
          "align: center; " +
          "color: #111827; " +
          "font-size: 0.14; " +
          "width: 3"

        );

      }

      else {

        pauseBtn.setAttribute(

          "troika-text",

          "value: ❚❚  PAUSAR; " +
          "align: center; " +
          "color: #111827; " +
          "font-size: 0.14; " +
          "width: 3"

        );

      }

    }


    // =====================================================
    // ADELANTAR
    // =====================================================

    function forward() {

      const duration =
        phaseConfig[
          currentPhase
        ].duration;


      progress =
        Math.min(

          progress + 10,

          duration

        );


      syncCurrentAnimation();


      updateTimeDisplay();


      if (
        progress >= duration
      ) {

        nextPhase();

      }

    }


    // =====================================================
    // RETROCEDER
    // =====================================================

    function backward() {

      progress -= 10;


      if (
        progress >= 0
      ) {

        syncCurrentAnimation();

        updateTimeDisplay();

        return;

      }


      previousPhase();


      const duration =
        phaseConfig[
          currentPhase
        ].duration;


      progress =
        Math.max(

          duration - 10,

          0

        );


      syncCurrentAnimation();


      updateTimeDisplay();

    }


    // =====================================================
    // ACTUALIZAR TEXTO DEL TIEMPO
    // =====================================================

    function updateTimeDisplay() {

      const duration =
        phaseConfig[
          currentPhase
        ].duration;


      timeInfo.textContent =

        progress.toFixed(2) +

        " / " +

        duration.toFixed(2) +

        " s";

    }


    // =====================================================
    // RESET
    // =====================================================

    function resetExperience() {

      const finalScene =
        "scene_IMG_20260528_152913_00_029";

      const targetUrl =
        "../index.html?startscene=" +
        encodeURIComponent(finalScene);


      if (
        window.parent &&
        window.parent !== window
      ) {

        window.parent.location.href =
          targetUrl;

      } else {

        window.location.href =
          targetUrl;

      }

    }


    // =====================================================
    // HOVER DE BOTONES
    // =====================================================

    document

      .querySelectorAll(
        ".clickable"
      )

      .forEach(

        button => {

          button.addEventListener(

            "mouseenter",

            () => {

              button.object3D.scale.set(

                1.08,

                1.08,

                1.08

              );

            }

          );


          button.addEventListener(

            "mouseleave",

            () => {

              button.object3D.scale.set(

                1,

                1,

                1

              );

            }

          );

        }

      );


    // =====================================================
    // EVENTOS DE LOS BOTONES
    // =====================================================

    document

      .querySelector(
        "#nextBtn"
      )

      .addEventListener(

        "click",

        nextPhase

      );


    document

      .querySelector(
        "#prevBtn"
      )

      .addEventListener(

        "click",

        previousPhase

      );


    document

      .querySelector(
        "#pauseBtn"
      )

      .addEventListener(

        "click",

        togglePause

      );


    document

      .querySelector(
        "#forwardBtn"
      )

      .addEventListener(

        "click",

        forward

      );


    document

      .querySelector(
        "#backBtn"
      )

      .addEventListener(

        "click",

        backward

      );


    document

      .querySelector(
        "#resetBtn"
      )

      .addEventListener(

        "click",

        resetExperience

      );


    // =====================================================
    // REGISTRAR LOS GLB
    // =====================================================

    registerAnimation(
      "phase1"
    );


    registerAnimation(
      "phase2"
    );


    registerAnimation(
      "phase3"
    );


    registerAnimation(
      "phase4Left"
    );


    registerAnimation(
      "phase4Right"
    );


    // =====================================================
    // RELOJ PRINCIPAL
    // =====================================================

    let lastTime =
      performance.now();


    function updateExperience(
      time
    ) {

      const delta =
        Math.min(

          (time - lastTime) /
          1000,

          0.1

        );


      lastTime = time;


      if (!paused) {

        const duration =
          phaseConfig[
            currentPhase
          ].duration;


        // Avanzar tiempo

        progress += delta;


        // No superar duración

        progress =
          Math.min(

            progress,

            duration

          );


        // Sincronizar animación

        syncCurrentAnimation();


        // Barra

        const percentage =
          Math.min(

            (progress / duration) *
            100,

            100

          );


        progressBar.style.width =
          percentage + "%";


        // Texto

        updateTimeDisplay();


        // Final de fase

        if (
          progress >= duration
        ) {

          nextPhase();

        }

      }


      requestAnimationFrame(
        updateExperience
      );

    }


    // =====================================================
    // INICIALIZACIÓN
    // =====================================================

    showModel(
      currentPhase
    );


    updateTimeDisplay();


    requestAnimationFrame(
      updateExperience
    );


  </script>

</body>

</html>
